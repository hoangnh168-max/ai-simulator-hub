
spring.application.name=ai-simulator-hub-backend

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_simulator_hub
spring.datasource.username=ai_simulator_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server
server.port=8080

# Health monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# AI Simulator Hub - LTI 1.3
lti.platform.base-url=${LTI_PLATFORM_BASE_URL:http://localhost:8080}
lti.keys.directory=${LTI_KEYS_DIRECTORY:${user.home}/.ai-simulator-hub/keys}

# LTI security
lti.login.state-ttl-seconds=300
lti.login.nonce-ttl-seconds=300
